[project]
name = "recosplat"
version = "1.0.0"
description = "Official inference and evaluation code for ReCoSplat"
readme = "README.md"
requires-python = "==3.10.18"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "dacite==1.9.2",
    "einops==0.8.1",
    "jaxtyping==0.3.3",
    "numpy>=1.26,<3",
    "pillow>=10",
    "scikit-image==0.25.2",
    "lpips==0.1.4",
    "safetensors==0.5.3",
    "gsplat==1.5.3",
    "diff-gaussian-rasterization",
    "setuptools>=75",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
diff-gaussian-rasterization = { git = "https://github.com/rmurai0610/diff-gaussian-rasterization-w-pose.git", rev = "43e21bff91cd24986ee3dd52fe0bb06952e50ec7" }

[tool.uv.extra-build-dependencies]
gsplat = ["torch", "numpy", "setuptools", "wheel"]
diff-gaussian-rasterization = ["torch", "numpy", "setuptools", "wheel"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recosplat"]
